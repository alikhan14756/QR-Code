<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>QR Code Converter - Responsive</title>
    <link rel="stylesheet" href="Style.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>

<body>
    <div class="wrapper">
        <!-- GENERATE QR SECTION -->
        <div class="container">
            <h3>🔳 Generate QR Code</h3>
            <p>Enter your text or URL</p>
            <input type="text" placeholder="Text or URL" id="qrText">
            
            <div id="imgBox">
                <img src="" id="qrImage" alt="Generated QR Code">
            </div>
            
            <div class="btn-group">
                <button onclick="generateQR()" class="btn-primary">Generate QR Code</button>
                <button onclick="downloadQR()" id="downloadBtn" class="btn-success" style="display:none;">Download QR</button>
            </div>
        </div>

        <!-- DECODE QR SECTION -->
        <div class="container">
            <h3>📷 Decode QR Code</h3>
            
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('camera', event)">Camera</button>
                <button class="tab-btn" onclick="switchTab('upload', event)">Upload</button>
            </div>

            <!-- Camera Scanner -->
            <div id="camera-section" class="tab-content active">
                <div id="reader"></div>
                <p class="small-text">Point your camera at a QR code</p>
            </div>

            <!-- Upload Section -->
            <div id="upload-section" class="tab-content">
                <div class="upload-area" onclick="document.getElementById('qrInput').click()">
                    <span class="upload-icon">📁</span>
                    <p>Tap to upload QR image</p>
                    <span class="file-types">Supports: JPG, PNG, WEBP</span>
                    <input type="file" id="qrInput" accept="image/*" onchange="decodeQRFromImage(this)" hidden>
                </div>
            </div>

            <!-- Result -->
            <div id="decodeResult" class="result-box" style="display:none;">
                <p class="result-label">Decoded Content:</p>
                <textarea id="decodedText" readonly></textarea>
                <div class="action-btns">
                    <button onclick="copyDecoded()" class="btn-copy">Copy</button>
                    <button onclick="openLink()" id="openLinkBtn" class="btn-link" style="display:none;">Open Link</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== GENERATE QR =====
        let imgBox = document.getElementById("imgBox");
        let qrImage = document.getElementById("qrImage");
        let qrText = document.getElementById("qrText");
        let currentQRData = "";

        function generateQR() {
            if (qrText.value.length > 0) {
                currentQRData = qrText.value;
                qrImage.src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(qrText.value);
                imgBox.classList.add("show-img");
                document.getElementById("downloadBtn").style.display = "inline-block";
            } else {
                qrText.classList.add('error');
                setTimeout(() => {
                    qrText.classList.remove('error');
                }, 1000);
            }
        }

        function downloadQR() {
            if (qrImage.src) {
                const link = document.createElement('a');
                link.href = qrImage.src;
                link.download = 'qrcode.png';
                link.click();
            }
        }

        // ===== DECODE QR =====
        let html5QrCode;
        let isScanning = false;

        function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 200, height: 200 } };
            
            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                console.error("Camera error:", err);
                document.getElementById("reader").innerHTML = "<p style='color:red; padding:20px; text-align:center;'>Camera access denied or not available. Please use upload option.</p>";
            });
            
            isScanning = true;
        }

        function onScanSuccess(decodedText, decodedResult) {
            showDecodedResult(decodedText);
            html5QrCode.stop();
            isScanning = false;
        }

        function onScanFailure(error) {}

        function switchTab(tab, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if (tab === 'camera') {
                document.getElementById('camera-section').classList.add('active');
                if (!isScanning) startScanner();
            } else {
                document.getElementById('upload-section').classList.add('active');
                if (isScanning) {
                    html5QrCode.stop();
                    isScanning = false;
                }
            }
        }

        function decodeQRFromImage(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);
                    
                    if (code) {
                        showDecodedResult(code.data);
                    } else {
                        alert("No QR code found in image!");
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function showDecodedResult(text) {
            const resultBox = document.getElementById('decodeResult');
            const textarea = document.getElementById('decodedText');
            const openLinkBtn = document.getElementById('openLinkBtn');
            
            textarea.value = text;
            resultBox.style.display = 'block';
            
            const urlPattern = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/;
            if (urlPattern.test(text) || text.startsWith('http')) {
                openLinkBtn.style.display = 'inline-block';
                openLinkBtn.onclick = () => window.open(text.startsWith('http') ? text : 'https://' + text, '_blank');
            } else {
                openLinkBtn.style.display = 'none';
            }
            
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function copyDecoded() {
            const textarea = document.getElementById('decodedText');
            textarea.select();
            document.execCommand('copy');
            
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = "Copied!";
            setTimeout(() => btn.textContent = originalText, 2000);
        }

        function openLink() {}

        // Handle Enter key
        qrText.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') generateQR();
        });

        // Start scanner on load
        window.onload = function() {
            // Delay slightly to ensure DOM is ready
            setTimeout(startScanner, 500);
        };

        // Handle visibility change (pause/resume camera)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isScanning) {
                html5QrCode.stop();
                isScanning = false;
            } else if (!document.hidden && document.getElementById('camera-section').classList.contains('active')) {
                setTimeout(startScanner, 500);
            }
        });
    </script>
</body>

</html>
